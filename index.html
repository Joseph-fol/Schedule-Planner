        <section class="schedulePage">
            <div class="inputs container col-lg-6 col-md-8 col-sm-6 col-10 px-4 py-2 rounded-4 mt-3 mb-3"
                style="box-shadow: 1px 1px 4px #0000007c;">

                <div class="text-center mt-2 pt-3">
                    <h3 class="fw-bold fs-1" style="color: #da9932;">Schedule Planner</h3>
                    <p class="fw-medium text-white mb-3">Organize your task and stay productive</p>
                </div>

                <div class="alert alert-danger p-2 my-2 justify-content-between" style="display: none" id="errMsg">
                    Inputs cannot be empty
                    <!-- <p style="cursor: pointer;">X</p> -->
                </div>

                <label for="" class="fw-medium my-2">Schedule Title</label>

                <input type="text" placeholder="Enter your task title" class="form form-control mb-3 shadow-none"
                    id="userTitle" autofocus>

                <label for="" class="fw-medium my-2">Schedule Description</label>

                <textarea type="text" rows="5" placeholder="Enter your description" class="form-control shadow-none p-3"
                    id="userDescription">
                </textarea>

                <label for="" class="fw-medium mt-4 mb-2">Target Date</label>
                <input type="date" placeholder="Enter your task title" class="form-control mb-3 shadow-none"
                    id="targetDate">

                <button class="btn text-white d-block ms-auto my-3 fw-semibold shadow-none"
                    style="background-color: #8b6830;" onclick="addSchedule()">Add Schedule</button>
            </div>

            <div id="userSchedule" style="display: none;">

            </div>
        </section>

    </div>
